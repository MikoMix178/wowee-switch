name: Build Switch NRO
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
      env:
        DEVKITPRO: /opt/devkitpro
        DEVKITARM: /opt/devkitpro/devkitARM
        DEVKITPPC: /opt/devkitpro/devkitPPC
        PATH: /opt/devkitpro/portlibs/switch/bin:/opt/devkitpro/devkitA64/bin:/opt/devkitpro/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - uses: actions/checkout@v5
        with:
          repository: jhuz0/nvk-switch
          path: nvk-switch

      - name: Check build-nvk workflow and tools
        run: |
          cat nvk-switch/.github/workflows/build-nvk.yml
          which ninja meson rustc cargo python3 cmake || true
