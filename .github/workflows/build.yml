name: Build Switch NRO
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
      env:
        DEVKITPRO: /opt/devkitpro
        DEVKITARM: /opt/devkitpro/devkitARM
        DEVKITPPC: /opt/devkitpro/devkitPPC
        PATH: /opt/devkitpro/portlibs/switch/bin:/opt/devkitpro/devkitA64/bin:/opt/devkitpro/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install prebuilt nvk-switch Vulkan driver
        run: |
          mkdir -p /tmp/nvk && cd /tmp/nvk
          URL=$(curl -s https://github.com | grep "browser_download_url" | cut -d '"' -f 4 | head -n 1)
          echo "Downloading: $URL"
          curl -L -o nvk.tar.gz "$URL"
          tar -xzf nvk.tar.gz || unzip -q nvk.tar.gz
          find . -name "libvulkan.a" -exec cp {} /opt/devkitpro/portlibs/switch/lib/ \;
          VULKAN_INC=$(find . -type d -name "vulkan" | head -n 1)
          if [ -n "$VULKAN_INC" ]; then
            cp -r "$VULKAN_INC" /opt/devkitpro/portlibs/switch/include/
          fi
          ls -la /opt/devkitpro/portlibs/switch/lib/libvulkan.a

      - name: Build wowee-switch
        run: |
          cmake -S "$PWD/wowee" -B build-switch -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/wowee/cmake/switch.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-switch --parallel "$(nproc)"
          cmake --build build-switch --target switchpkg

      - uses: actions/upload-artifact@v5
        with:
          name: wowee-switch-nro
          path: build-switch/*.nro
