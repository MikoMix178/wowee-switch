name: Build Switch NRO
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
      env:
        DEVKITPRO: /opt/devkitpro
        DEVKITARM: /opt/devkitpro/devkitARM
        DEVKITPPC: /opt/devkitpro/devkitPPC
        PATH: /opt/devkitpro/devkitA64/bin:/opt/devkitpro/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Switch libraries
        run: |
          dkp-pacman -Syu --noconfirm switch-dev switch-mesa switch-sdl2 switch-glm

      - name: Build
        run: |
          mkdir -p build && cd build
          dkp-cmake ..
          make -j$(nproc)

      - uses: actions/upload-artifact@v5
        with:
          name: wowee-switch-nro
          path: build/*.nro
