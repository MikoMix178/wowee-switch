name: Build Switch NRO
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
      env:
        DEVKITPRO: /opt/devkitpro
        DEVKITARM: /opt/devkitpro/devkitARM
        DEVKITPPC: /opt/devkitpro/devkitPPC
        PATH: /opt/devkitpro/portlibs/switch/bin:/opt/devkitpro/devkitA64/bin:/opt/devkitpro/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Check nxvk requirements and releases
        run: |
          cat wowee/cmake/switch/nxvk.cmake
          echo "=== RELEASES ==="
          curl -s https://github.com | grep -E "tag_name|browser_download_url" || true
          echo "=== WORKFLOW RUNS ==="
          curl -s https://github.com | grep -E "id|status|conclusion" | head -n 20 || true
